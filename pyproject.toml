[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-pseudospace"
version = "0.1.0"
description = "Reusable helpers for kidney nephron pseudospace analysis."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pseudospace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
