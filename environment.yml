name: kidney-pseudospace
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy<2
  - pandas
  - pyarrow
  - scipy
  - scikit-learn
  - joblib
  - threadpoolctl
  - matplotlib
  - seaborn
  - anndata
  - scanpy
  - python-igraph
  - leidenalg
  - statsmodels
  - patsy
  - h5py
  - numba
  - r-base
  - r-harmony=2.0.5
  - bioconductor-limma
  - rpy2
  - jupyterlab
  - nbformat
  - pytest
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - shapely>=2
      - gseapy>=1.3,<1.4
      - pydeseq2>=0.5,<0.6
      - scFates==1.2.5
      - genes2genes @ git+https://github.com/Teichlab/Genes2Genes.git@42ba945d370a864464a2d3cc7174aa0ee451e600
      - pseudospace-reconstruction @ git+https://github.com/calebhallinan/pseudospace_reconstruction.git@59da04bee28f457e17bf1661060151d5fee2dac6
